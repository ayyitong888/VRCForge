<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VRCForge</title>
    <link rel="preload" as="image" href="/vrcforge-startup-registered-ink.webp" />
    <link rel="preload" as="image" href="/vrcforge-startup-portrait.webp" />
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f5f6f8; }
      main[data-vrcforge-startup-shell] {
        --startup-duration: 3550ms;
        position: fixed;
        inset: 0;
        z-index: 1000;
        overflow: hidden;
        background: #fffafd;
        animation: startup-camera var(--startup-duration) linear both;
        animation-play-state: paused;
      }
      .startup-sketch {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
        pointer-events: none;
      }
      /* Draw for 3 seconds, hold for 200 ms, then crossfade for 350 ms. */
      @keyframes startup-camera {
        from, 90.140845% { opacity: 1; transform: scale(1); }
        to { opacity: 0; transform: scale(1.03); }
      }
      .startup-progress {
        position: absolute;
        inset: auto 1.5rem 1.25rem;
        margin: 0;
        color: #654758;
        text-align: center;
        font: 500 .8125rem/1.4 system-ui, sans-serif;
      }
      .startup-progress:not([hidden]) {
        padding: .35rem .75rem;
        width: fit-content;
        margin-inline: auto;
        background: #fffafd;
        border-radius: .35rem;
      }
      .startup-failure {
        position: absolute;
        inset: 50% auto auto 50%;
        transform: translate(-50%, -50%);
        width: min(28rem, calc(100% - 3rem));
        padding: 1.5rem;
        box-sizing: border-box;
        color: #372b34;
        background: #fff;
        border: 1px solid #eadce5;
        border-radius: .8rem;
        font: .875rem/1.5 system-ui, sans-serif;
      }
      [data-startup-phase="error"] .startup-sketch { visibility: hidden; }
      .startup-failure h1 { margin: 0; font-size: 1.1rem; }
      .startup-failure pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9rem; overflow: auto; }
      .startup-failure button { padding: .4rem .85rem; border-radius: .35rem; border: 1px solid #785164; color: #fff; background: #785164; cursor: pointer; }
      @media (prefers-reduced-motion: reduce) {
        main[data-vrcforge-startup-shell] { animation: none; }
      }
      @media (prefers-color-scheme: dark) {
        html, body, #root { background: #111827; }
      }
    </style>
  </head>
  <body>
    <main data-vrcforge-startup-shell aria-label="VRCForge" hidden>
      <canvas class="startup-sketch" width="1000" height="802" aria-hidden="true"></canvas>
      <p class="startup-progress" role="status" hidden></p>
      <section class="startup-failure" role="alertdialog" aria-modal="true" aria-labelledby="startup-failure-title" tabindex="-1" hidden>
        <h1 id="startup-failure-title"></h1>
        <p></p>
        <pre></pre>
        <button type="button"></button>
      </section>
    </main>
    <div id="root"></div>
    <script>
      (function measureStartupShellPaint() {
        try {
          if (localStorage.getItem("vrcforge_startup_animation") === "false") return;
        } catch {
          // The opening still works when preferences are unavailable.
        }
        document.getElementById("root").inert = true;
        document.querySelector("main[data-vrcforge-startup-shell]").hidden = false;
        var metrics = (window.__vrcforgeStartupMetrics ||= {});
        metrics.startupShellRequestedMs ??= Math.round(performance.now());
        window.__vrcforgeStartupShellPaintedPromise = new Promise(function (resolve) {
          window.requestAnimationFrame(function () {
            window.setTimeout(function () {
              metrics.startupShellPaintedMs ??= Math.round(performance.now());
              document.documentElement.dataset.vrcforgeStartupShell = "ready";
              resolve();
            }, 0);
          });
        });
      })();
    </script>
    <script defer src="/vrcforge-startup-sketch.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
