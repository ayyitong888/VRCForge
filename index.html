<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VRCForge</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f5f6f8; }
      main[data-vrcforge-startup-shell] {
        --startup-duration: 4800ms;
        position: fixed;
        inset: 0;
        z-index: 1000;
        overflow: hidden;
        background: linear-gradient(140deg, #fffcfd 22%, #fff2f7 70%, #f4e8f7);
      }
      .startup-portrait {
        position: absolute;
        inset: 0 0 0 33%;
        overflow: hidden;
        mask-image: linear-gradient(90deg, transparent, #000 46%);
      }
      .startup-portrait::before {
        content: "";
        position: absolute;
        inset: -3%;
        background: url("/vrcforge-startup-portrait.webp") 82% 44% / cover no-repeat;
        transform-origin: 72% 37%;
        animation: startup-camera var(--startup-duration) cubic-bezier(.2, .72, .29, 1) both;
      }
      .startup-materials {
        position: absolute;
        left: 22%;
        top: 50%;
        width: clamp(8rem, 20vw, 15rem);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .startup-swatch {
        position: absolute;
        inset: 25% 17%;
        overflow: hidden;
        border: 1px solid var(--edge);
        border-radius: 11%;
        background: linear-gradient(145deg, #fff9fc, var(--fabric));
        box-shadow: 0 .5rem 1.4rem #ad6d9426, inset 0 1px #fff;
        transform: translateY(var(--lift)) rotate(-28deg) skewX(16deg);
        animation: startup-swatch 1.45s var(--delay) cubic-bezier(.18, .72, .25, 1) both;
      }
      .startup-swatch:nth-child(1) { --lift: 29%; --delay: 160ms; --edge: #d8a3bd; --fabric: #efc8d9; }
      .startup-swatch:nth-child(2) { --lift: 1%; --delay: 80ms; --edge: #c9afd9; --fabric: #e3d1ee; }
      .startup-swatch:nth-child(3) { --lift: -28%; --delay: 0ms; --edge: #dfa9bf; --fabric: #f4cddf; }
      .startup-swatch::before {
        content: "";
        position: absolute;
        inset: 10%;
        border: 1px dashed #a9557d66;
        border-radius: 8%;
      }
      .startup-swatch:last-child::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(112deg, transparent 32%, #fff9fdc9 51%, transparent 69%);
        opacity: 0;
        animation: startup-swatch-light var(--startup-duration) ease-in-out both;
      }
      @keyframes startup-camera {
        from { transform: translate3d(1.5%, .5%, 0) scale(1); }
        to { transform: translate3d(-1.8%, -1%, 0) scale(1.07); }
      }
      @keyframes startup-swatch {
        from { opacity: .16; transform: translateY(9%) rotate(-19deg) skewX(10deg) scale(.82); }
        to { opacity: 1; transform: translateY(var(--lift)) rotate(-28deg) skewX(16deg); }
      }
      @keyframes startup-swatch-light {
        0%, 25% { opacity: 0; transform: translateX(-110%); }
        40%, 64% { opacity: .83; }
        83%, 100% { opacity: 0; transform: translateX(110%); }
      }
      @media (orientation: portrait) {
        .startup-portrait { inset: 0; mask-image: linear-gradient(0deg, transparent 12%, #000 58%); }
        .startup-portrait::before { background-position: 62% 44%; }
        .startup-materials { top: auto; left: 50%; bottom: 5%; transform: translateX(-50%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-portrait::before, .startup-swatch, .startup-swatch:last-child::after { animation: none; }
      }
      @media (prefers-color-scheme: dark) {
        html, body, #root { background: #111827; }
      }
    </style>
  </head>
  <body>
    <main data-vrcforge-startup-shell aria-label="VRCForge" hidden>
      <div class="startup-portrait" aria-hidden="true"></div>
      <div class="startup-materials" aria-hidden="true">
        <div class="startup-swatch"></div><div class="startup-swatch"></div><div class="startup-swatch"></div>
      </div>
    </main>
    <div id="root"></div>
    <script>
      (function measureStartupShellPaint() {
        try {
          if (localStorage.getItem("vrcforge_startup_animation") === "false") return;
        } catch {
          // The opening still works when preferences are unavailable.
        }
        document.getElementById("root").inert = true;
        document.querySelector("main[data-vrcforge-startup-shell]").hidden = false;
        var metrics = (window.__vrcforgeStartupMetrics ||= {});
        metrics.startupShellRequestedMs ??= Math.round(performance.now());
        window.__vrcforgeStartupShellPaintedPromise = new Promise(function (resolve) {
          window.requestAnimationFrame(function () {
            window.setTimeout(function () {
              metrics.startupShellPaintedMs ??= Math.round(performance.now());
              document.documentElement.dataset.vrcforgeStartupShell = "ready";
              resolve();
            }, 0);
          });
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
