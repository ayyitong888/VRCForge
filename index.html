<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VRCForge</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f5f6f8; }
      @media (prefers-color-scheme: dark) { html, body, #root { background: #111827; } }
    </style>
  </head>
  <body>
    <div id="root"><main data-vrcforge-startup-shell aria-hidden="true" style="height:100vh;pointer-events:none"></main></div>
    <script>
      (function scheduleStartupShellPaint() {
        var metrics = (window.__vrcforgeStartupMetrics ||= {});
        metrics.startupShellRequestedMs ??= Math.round(performance.now());
        window.__vrcforgeStartupShellPaintedPromise ??= new Promise(function (resolve) {
          window.requestAnimationFrame(function () {
            window.setTimeout(function () {
              metrics.startupShellPaintedMs ??= Math.round(performance.now());
              document.documentElement.dataset.vrcforgeStartupShell = "ready";
              resolve();
            }, 0);
          });
        });
      })();
    </script>
    <script type="module">
      void (async function loadAppAfterStartupShell() {
        await window.__vrcforgeStartupShellPaintedPromise;
        await import("/src/main.tsx");
      })();
    </script>
  </body>
</html>
