[package]
name = "vrcforge-agentic-app"
version = "1.7.8"
default-run = "vrcforge-agentic-app"
description = "VRCForge agentic desktop application"
authors = ["VRCForge"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
getrandom = "0.3"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.2.0", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-notification = "2"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "url"] }
ureq = { version = "2", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
tauri-winrt-notification = "0.7.3"
windows-capture = "2.0.0"
windows-sys = { version = "0.59", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Services", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
