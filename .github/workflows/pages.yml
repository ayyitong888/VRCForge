name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/assets/vrcforge-atelier-banner.png'
      - 'src-tauri/icons/icon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Stage public website only
        run: |
          mkdir -p _site/assets
          cp -R site/. _site/
          cp docs/assets/vrcforge-atelier-banner.png _site/assets/hero.png
          cp src-tauri/icons/icon.png _site/assets/icon.png
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
