[package]
name = "vrcforge-setup"
version = "1.10.9"
edition = "2021"

[build-dependencies]
tauri-build = "=2.6.2"

[dependencies]
tauri = "=2.11.2"
tauri-plugin-opener = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "=0.55.0"
tempfile = "3"
tar = "0.4"
zstd = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
